# What SonarCloud analyses, and what it leaves out of coverage.
#
# decisions/016-ci-and-sonarcloud.md

sonar.projectKey=koodauspaja_treenivihko
sonar.organization=koodauspaja

# Everything, so workflows and configuration are analysed too.
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Declared rather than excluded, so Sonar applies its test rules to them and
# keeps them out of coverage and duplication.
sonar.tests=tests
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Without it the scan finishes before the quality gate is decided, and a failed
# gate never fails the check.
sonar.qualitygate.wait=true

sonar.exclusions=package-lock.json,node_modules/**,.next/**,coverage/**,playwright-report/**,test-results/**,next-env.d.ts

# The files in scripts/coverage-plan.ts's coverageExclusions, then the
# configuration at the root, which no unit test runs.
# tests/unit/scripts/sonar-exclusions.test.ts keeps the two in step.
sonar.coverage.exclusions=scripts/coverage-gaps.ts,scripts/sonar-gate.ts,next.config.ts,playwright.config.ts,vitest.config.ts
