# What SonarCloud analyses, and what it leaves out of coverage.
#
# decisions/016-ci-and-sonarcloud.md

sonar.projectKey=koodauspaja_treenivihko
sonar.organization=koodauspaja

# Everything, so workflows and configuration are analysed too.
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Declared rather than excluded, so Sonar applies its test rules to them and
# keeps them out of coverage and duplication.
sonar.tests=tests
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Without it the scan finishes before the quality gate is decided, and a failed
# gate never fails the check.
sonar.qualitygate.wait=true

# tests/** is excluded from the main sources only: sonar.tests indexes the same
# files as tests, with Sonar's test rules, and a file indexed as both aborts
# the scan.
sonar.exclusions=tests/**,package-lock.json,drizzle/migrations/meta/**,node_modules/**,.next/**,coverage/**,playwright-report/**,test-results/**,next-env.d.ts

# The files in scripts/coverage-plan.ts's coverageExclusions, then the
# configuration at the root, which no unit test runs.
# tests/unit/scripts/sonar-exclusions.test.ts keeps the two in step.
sonar.coverage.exclusions=scripts/coverage-gaps.ts,scripts/sonar-gate.ts,scripts/generate-migration.ts,scripts/migrate.ts,scripts/migration-history.ts,scripts/set-trainer-password.ts,src/lib/trainer/store.ts,src/lib/exercises/store.ts,src/lib/periods/store.ts,src/lib/marks/store.ts,src/lib/progress/store.ts,drizzle.config.ts,next.config.ts,playwright.config.ts,vitest.config.ts,.railway/railway.ts
# The label list is a table of data, 21 rows of one shape, not repeated logic.
# decisions/f002-exercise-library.md
sonar.cpd.exclusions=src/lib/exercises/labels.ts
