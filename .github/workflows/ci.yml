# What npm run verify runs, and SonarCloud's analysis with the unit coverage,
# on every pull request to main and every push to it. They pass only for the
# actors named in setup 001, and Renovate; for anyone else they fail.
#
# decisions/016-ci-and-sonarcloud.md

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A newer run of a pull request replaces the older one; every push to main runs.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # A skipped job counts as passed, so anyone else gets a failure, not a skip.
      - name: Only the people named in setup 001
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ vars.OWNER_USERNAME }}
          COLLABORATOR: ${{ vars.COLLABORATOR_USERNAME }}
        run: |
          case "$ACTOR" in
            "$OWNER" | "$COLLABORATOR" | "renovate[bot]") ;;
            *) echo "::error::CI runs only for the actors named in setup 001, and $ACTOR is not one"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Node 24 ships an older npm, which .npmrc's engine-strict refuses.
      - run: npm install --global --ignore-scripts npm@12.2.1
      # A dependency's install script is how a compromised package runs code on
      # a runner holding the repository's tokens.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      # A migration main already has is never edited. The refspec names where
      # main lands, since the check reads origin/main.
      # decisions/025-migration-history.md
      - name: Migrations on main are unchanged
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          npm run db:check-history
      - run: npm run test:unit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-coverage
          path: coverage/lcov.info
          retention-days: 1
          if-no-files-found: error

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          # A random value no person needs, from a secret rather than written here.
          # decisions/023-database.md
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: treenivihko_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d treenivihko_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/treenivihko_test
    steps:
      # A skipped job counts as passed, so anyone else gets a failure, not a skip.
      - name: Only the people named in setup 001
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ vars.OWNER_USERNAME }}
          COLLABORATOR: ${{ vars.COLLABORATOR_USERNAME }}
        run: |
          case "$ACTOR" in
            "$OWNER" | "$COLLABORATOR" | "renovate[bot]") ;;
            *) echo "::error::CI runs only for the actors named in setup 001, and $ACTOR is not one"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global --ignore-scripts npm@12.2.1
      - run: npm ci --ignore-scripts
      - run: npm run test:integration

  e2e:
    name: Build and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # A skipped job counts as passed, so anyone else gets a failure, not a skip.
      - name: Only the people named in setup 001
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ vars.OWNER_USERNAME }}
          COLLABORATOR: ${{ vars.COLLABORATOR_USERNAME }}
        run: |
          case "$ACTOR" in
            "$OWNER" | "$COLLABORATOR" | "renovate[bot]") ;;
            *) echo "::error::CI runs only for the actors named in setup 001, and $ACTOR is not one"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global --ignore-scripts npm@12.2.1
      - run: npm ci --ignore-scripts
      - run: npm run test:e2e:browser -- --with-deps
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  sonarcloud:
    name: SonarCloud scan
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # SonarCloud reads the pull request to decorate it.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Blame data for "new code" needs the whole history.
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unit-coverage
          path: coverage
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # The free plan's quality gate cannot be changed, so the limits this
      # project holds to, nothing new and nothing open, are checked here. Node
      # runs the TypeScript itself: no dependency is installed in a job that
      # holds SONAR_TOKEN.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/sonar-gate.ts
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
